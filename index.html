<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Throttle Rush</title>

    <!-- Lettertypen: Lilita One (dikke arcade-cijfers) en Nunito (leesbare tekst).
         display=swap: eerst een gewoon lettertype, daarna wisselt het zonder wit flitsen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Stijl van de interface (HUD en besturingshulp) -->
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <link rel="stylesheet" href="/src/ui/race.css" />
    <link rel="stylesheet" href="/src/ui/ability.css" />
    <link rel="stylesheet" href="/src/ui/sound.css" />
    <link rel="stylesheet" href="/src/ui/minimap.css" />
    <link rel="stylesheet" href="/src/ui/touch.css" />

    <!-- Staat hier inline zodat de lichtblauwe achtergrond er al is
         voordat het externe CSS-bestand binnen is: geen wit scherm bij laden. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
      canvas { display: block; touch-action: none; }
      body { touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      .is-touch .menu__keys::after { display: none; }
    </style>
  </head>
  <body>
    <!-- Hier komen HUD.js en controlsHint.js hun onderdelen in -->
    <div id="ui"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
